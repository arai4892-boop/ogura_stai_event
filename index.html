<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORC PayPay</title>

<style>
body{
    font-family: sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.card{
    max-width:400px;
    margin:60px auto;
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* ★ご協賛品（強調） */
.big-label{
    font-size:28px;
    font-weight:900;
    margin-bottom:15px;
}

/* 通常ラベル */
.label{
    color:#666;
    margin-top:10px;
}

.item{
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.price{
    font-size:44px;
    font-weight:bold;
    margin:20px 0;
}

button{
    width:100%;
    background:#00b900;
    color:white;
    border:none;
    border-radius:14px;
    padding:18px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="card">

    <div class="big-label">ご協賛品</div>

    <div class="label">商品名</div>

    <div class="item">ペヤングソースやきそば</div>

    <div class="price">¥0</div>

    <button onclick="playSound()">
        食べてください！！！😆
    </button>

</div>

<audio id="voice">
    <source src="paypay.mp3" type="audio/mpeg">
</audio>

<script>
function playSound(){
    const audio = document.getElementById("voice");
    audio.currentTime = 0;
    audio.play();
}
</script>

</body>
</html>
